services:
  uploader:
    build: .
    container_name: uploader
    restart: unless-stopped
    init: true                # passes docker stop signals to Python properly
    stop_grace_period: 2m     # time to finish the current upload before Docker force-kills
    env_file: .env
    logging:
      driver: json-file
      options:
        max-size: "10m"         # start a new log file when the current one reaches 10 MB
        max-file: "5"           # keep at most 5 files (50 MB total), oldest is deleted
    volumes:
      # Mounted at the same paths as on the server, so the paths in .env work as-is
      # Server's Syncthing copy of the images
      - ${IMAGE_UPLOAD_FOLDER}:${IMAGE_UPLOAD_FOLDER}
      # The whole HMI share as ONE mount, so moves inside it are real renames on the HMI
      # (separate mounts would copy every file through the tunnel and back)
      - ${HMI_FOLDER}:${HMI_FOLDER}
