services:
  # Fake S3 for testing (MinIO's public images are no longer available)
  s3mock:
    image: adobe/s3mock:latest
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: test-images,test-data
    ports:
      - "9090:9090"   # browse buckets at http://localhost:9090

  uploader:
    depends_on:
      - s3mock
    environment:
      # These override whatever is in .env, for testing only
      AWS_ENDPOINT_URL: http://s3mock:9090
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      IMAGES_BUCKET: test-images
      DATA_BUCKET: test-data
      SLEEP_SECONDS: "20"           # scan often so the test is quick
      FILE_MIN_AGE_SECONDS: "5"
      CLEANUP_ENABLED: "false"      # cleaner.py is skipped in this run
      PING_IP: ""                   # no ping check in this run
